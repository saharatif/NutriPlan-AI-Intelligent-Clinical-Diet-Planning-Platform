<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body { font-family: Helvetica, Arial, sans-serif; color: #0a1317; }
      h1 { font-size: 28px; }
      .banner { background: #fff4f2; border: 1px solid #b42318; color: #b42318; padding: 12px; margin: 16px 0; }
      table { border-collapse: collapse; width: 100%; font-size: 11px; }
      th, td { border: 1px solid #d8dde5; padding: 6px; text-align: left; }
      th { background: #f4f6f8; }
    </style>
  </head>
  <body>
    <h1>NutriPlan AI Diet Chart</h1>
    <p>Plan {{PLAN_ID}}</p>
    <div class="banner">ALLERGEN EXCLUSIONS: See medical profile and clinical notes.</div>
    <table>
      <thead><tr><th>Week</th><th>Day</th><th>Meal</th><th>Name</th><th>kcal</th><th>P/F/C</th></tr></thead>
      <tbody>{{MEAL_ROWS}}</tbody>
    </table>
  </body>
</html>
